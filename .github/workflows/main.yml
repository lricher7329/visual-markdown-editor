name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint:fix

      - run: yarn test

      - run: yarn build

      - run: yarn package

      - uses: actions/upload-artifact@v4
        with:
          name: visual-markdown-editor.vsix
          path: visual-markdown-editor.vsix
